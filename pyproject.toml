[project]
name = "student-retention"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Dang Nguyen", email = "via.haidang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "starlette>=0.48.0,<1.8.0",
    "streamlit>=1.59.1",
]

[project.scripts]
student-retention = "student_retention:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
